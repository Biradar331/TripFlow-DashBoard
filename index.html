<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">
          <i class="fa-solid fa-plane-departure"></i>
          <h1>TripFlow</h1>
        </div>
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Search destinations, trips..." />
        </div>
        <div class="nav-actions">
          <button class="notification-btn">
            <i class="fa-regular fa-bell"></i>
          </button>

          <div class="profile">
            <img src="assets/images/profile.jpg" alt="Profile Picture" />
            <div class="profile-info">
              <h4>Pavan</h4>
              <p>Traveler</p>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="dashboard">
      <section class="hero-section">
        <div class="hero-content">
          <span class="trip-label">UPCOMING TRIP</span>

          <h2>Bali, Indonesia</h2>

          <p class="hero-description">
            Experience the perfect blend of beaches, culture, adventure, and
            relaxation.
          </p>

          <div class="trip-details">
            <div class="detail-item">
              <i class="fa-regular fa-calendar"></i>
              <span>15 Aug - 22 Aug 2026</span>
            </div>

            <div class="detail-item">
              <i class="fa-solid fa-users"></i>
              <span>2 Travelers</span>
            </div>

            <div class="detail-item">
              <i class="fa-solid fa-plane"></i>
              <span>Round Trip</span>
            </div>
          </div>

          <button class="itinerary-btn">
            View Itinerary
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>

        <div class="hero-image">
          <img src="assets/images/Bali.jpg" alt="Bali, Indonesia destination" />
        </div>
      </section>
      <section class="timeline-section"></section>

      <section class="widgets-section"></section>
    </main>
  </body>
</html>
